<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <div class="wrapper">

        <h1>Weather</h1>



        <div class="tab-container">
            <p class = "tab" data-userWeather>Your Weather</p>
            <p class = "tab" data-searchWeather>Search Weather</p>
        </div>


        <div class="weather-container">

            <!-- Grant location container-->

            <div class="sub-container grant-location-container">
                <img src = "location_access_icon.jpg" alt = "Grant-location" width = "80" height="80" loading="lazy">
                <p>Grant Location Access</p>
                <p>Allow access to get weather information</p>
                <button type = "submit" class = "btn" data-grantAccess>Grant Access</button>
            </div>

            <!-- Search form-->

            <form class = "form-container" data-searchForm>

                <input placeholder="Seach for City..." data-searchInput>
                <button class = "btn"><img src = "Search icon image.webp" alt = "search" width="20" height="20" loading="lazy"></button>

            </form>

            <!-- loading screen container  -->

            <div class="sub-container loading-container">
                <img src = "Spinner-2.gif" width = "150" height="150">
                <p>Loading </p>
            </div>


            <!-- Show weather info-->

            <div class="sub-container user-info-container">

                <!-- city name and flag -->
                <div class="name">
                    <p data-cityName></p>
                    <img data-countryIcon>
                </div>

                <!-- weather description -->
                <p data-weatherDesc></p>

                <!-- weahter icon  -->
                <img data-weatherIcon>
                
                <!-- temperatue  -->
                <p data-temp></p>

                <!-- 3 cards - parameters -->

                <div class="parameter-container">

                    <div class="parameter">

                        <img src= "wind-image.jpg" alt = "wind"  loading="lazy">
                        <p>WindSpeed</p>
                        <p data-windspeed></p>

                    </div>

                    <div class="parameter">

                        <img src= "humidity-image.png" alt = "humuidty"  loading="lazy">
                        <p>Humidity</p>
                        <p data-humidity></p>

                    </div>

                    <div class="parameter">

                        <img src= "cloud-image.jpg" alt = "cloud"  loading="lazy" style = "background: transparent;">
                        <p>Clouds</p>
                        <p data-cloudiness></p>

                    </div>

                </div>



            </div>

        </div>

    </div>

    <script src = "index.js"></script>
</body>
</html>
