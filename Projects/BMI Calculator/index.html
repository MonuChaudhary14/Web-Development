<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="wrapper">

        <p>BMI Calculator</p>

        <label for = "h">Height(in cm)</label>
        <input type = "number" class = "height" name = "h">

        <label for = "w" >weight(in kg)</label>
        <input type = "number" class = "weight" name = "w">

        <button onclick = "calculate()" class = "button" >Calculate</button>

        <p class = "result" style = "color: black;"></p>

    </div>


    <script src = "script.js"></script>
</body>
</html>
