<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="wrapper">

        <div class="watch">

            <p class = "one">1</p>
            <p class = "two">2</p>
            <p class = "three">3</p>  
            <p class = "four">4</p>
            <p class = "five">5</p>
            <p class = "six">6</p>
            <p class = "seven">7</p>
            <p class = "eight">8</p>
            <p class = "nine">9</p>
            <p class = "ten">10</p>
            <p class = "eleven">11</p>
            <p class = "twelve">12</p>

            <div class="second-hand"></div>
            <div class="minute-hand"></div>
            <div class="hour-hand"></div>

        </div>


    </div>
    <script src = "script.js"></script>
</body>
</html>
